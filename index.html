<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2d3436">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PomoTodo">
  <title>PomoTodo - Study Timer & Tasks</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root {
      --primary: #2d3436;
      --primary-light: #636e72;
      --accent: #00b894;
      --warning: #fdcb6e;
      --danger: #d63031;
      --success: #00b894;
      --text: #2d3436;
      --text-light: #636e72;
      --bg: #f5f6fa;
      --card: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: env(safe-area-inset-top, 10px) 10px env(safe-area-inset-bottom, 10px);
    }

    .app-container {
      max-width: 500px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 20px;
      min-height: calc(100vh - 20px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 { font-size: 22px; font-weight: 700; }

    /* Calendar */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: white;
    }

    .calendar-header h2 { font-size: 18px; }

    .calendar-nav-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 5px 10px;
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 10px 15px;
      background: white;
      border-bottom: 1px solid #eee;
    }

    .weekday {
      text-align: center;
      font-size: 11px;
      color: var(--text-light);
      font-weight: 600;
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 10px 15px;
      background: white;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      border-radius: 50%;
      margin: 2px;
      transition: all 0.2s;
    }

    .calendar-day:hover { background: #f0f0f0; }
    .calendar-day.other-month { color: #ccc; }
    .calendar-day.today { background: var(--primary); color: white; }
    .calendar-day.selected { background: var(--accent); color: white; }
    .calendar-day.has-task { position: relative; }
    .calendar-day.has-task::after {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--danger);
      border-radius: 50%;
      position: absolute;
      bottom: 4px;
    }

    .day-tasks-count {
      font-size: 9px;
      color: var(--accent);
      font-weight: 600;
    }

    /* Task List */
    .task-section {
      padding: 20px;
    }

    .task-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .task-section-header h3 { font-size: 16px; }

    .add-task-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }

    .task-list { list-style: none; }

    .task-item {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: all 0.2s;
    }

    .task-item:active { transform: scale(0.98); }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .task-title { font-size: 15px; font-weight: 600; color: var(--text); }

    .task-time {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 4px;
    }

    .task-timer-display {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .timer-display {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      font-family: monospace;
    }

    .timer-display.running { color: var(--accent); }

    .timer-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }

    .timer-btn.play { background: var(--accent); color: white; }
    .timer-btn.pause { background: var(--warning); color: var(--text); }
    .timer-btn.stop { background: var(--danger); color: white; }

    .countdown {
      font-size: 12px;
      color: var(--danger);
      margin-left: auto;
    }

    .countdown.urgent {
      background: var(--danger);
      color: white;
      padding: 4px 8px;
      border-radius: 10px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h3 { margin-bottom: 20px; font-size: 18px; }

    .form-group { margin-bottom: 15px; }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 5px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #eee;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus { border-color: var(--primary); }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .btn-cancel { background: #eee; color: var(--text-light); }
    .btn-save { background: var(--primary); color: white; }
    .btn-delete { background: var(--danger); color: white; }

    .export-import-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .export-import-btns button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }

    .btn-export { background: var(--accent); color: white; }
    .btn-import { background: #636e72; color: white; }

    /* Nav Bar */
    .nav-bar {
      display: flex;
      background: white;
      border-top: 1px solid #eee;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      padding: 12px;
      color: var(--text-light);
      font-size: 12px;
      cursor: pointer;
    }

    .nav-item.active { color: var(--primary); background: #f0f0f0; }
    .nav-item span { display: block; font-size: 20px; margin-bottom: 2px; }

    /* Stats */
    .stats-view { padding: 20px; }
    .stats-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .chart-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .chart-label { font-size: 13px; min-width: 60px; }
    .chart-bar-fill {
      flex: 1;
      height: 20px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
    }

    .chart-bar-value { font-size: 12px; min-width: 50px; text-align: right; }

    /* Empty */
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-light);
    }

    .empty-state span { font-size: 40px; display: block; margin-bottom: 10px; }

    /* Notification */
    .notification-banner {
      display: none;
      background: var(--accent);
      color: white;
      padding: 10px 20px;
      text-align: center;
      font-size: 14px;
    }

    .notification-banner.active { display: block; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="notification-banner" id="notificationBanner">
      🔔 Click to enable notifications
    </div>

    <!-- Main View -->
    <div id="mainView">
      <div class="header">
        <h1>📚 PomoTodo</h1>
      </div>

      <!-- Calendar -->
      <div class="calendar-header">
        <button class="calendar-nav-btn" onclick="app.changeMonth(-1)">◀</button>
        <h2 id="currentMonth">2024</h2>
        <button class="calendar-nav-btn" onclick="app.changeMonth(1)">▶</button>
      </div>

      <div class="calendar-weekdays">
        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>
      </div>

      <div class="calendar-days" id="calendarDays"></div>

      <!-- Tasks for selected day -->
      <div class="task-section">
        <div class="task-section-header">
          <h3 id="selectedDateLabel">Today's Tasks</h3>
          <button class="add-task-btn" onclick="app.openAddTaskModal()">+ Add</button>
        </div>
        <ul class="task-list" id="taskList"></ul>
      </div>
    </div>

    <!-- Stats View -->
    <div id="statsView" style="display:none;">
      <div class="header">
        <h1>📊 Stats</h1>
      </div>
      <div class="stats-view" id="statsContent"></div>
    </div>

    <!-- Nav Bar -->
    <div class="nav-bar">
      <div class="nav-item active" onclick="app.switchView('main')">
        <span>📅</span>
        Tasks
      </div>
      <div class="nav-item" onclick="app.switchView('stats')">
        <span>📊</span>
        Stats
      </div>
    </div>
  </div>

  <!-- Add/Edit Task Modal -->
  <div class="modal" id="taskModal">
    <div class="modal-content">
      <h3 id="taskModalTitle">Add Task</h3>
      <div class="form-group">
        <label>Task Title</label>
        <input type="text" id="taskTitle" placeholder="e.g. Math homework">
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input type="date" id="taskDate">
      </div>
      <div class="form-group">
        <label>Due Time (optional)</label>
        <input type="time" id="taskTime">
      </div>
      <div class="form-group">
        <label>Remind me before</label>
        <select id="taskReminder">
          <option value="0">No reminder</option>
          <option value="15">15 minutes before</option>
          <option value="30">30 minutes before</option>
          <option value="60">1 hour before</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes (optional)</label>
        <textarea id="taskNotes" rows="3" placeholder="Additional details..."></textarea>
      </div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="app.closeModal()">Cancel</button>
        <button class="btn-delete" id="deleteTaskBtn" onclick="app.deleteTask()" style="display:none;">Delete</button>
        <button class="btn-save" onclick="app.saveTask()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'pomodo_tasks';
    let editingTaskId = null;
    let activeTimerTaskId = null;
    let timerInterval = null;
    let timerSeconds = 0;
    let isTimerPaused = false;

    const app = {
      tasks: [],
      currentDate: new Date(),
      selectedDate: new Date().toISOString().split('T')[0],

      init() {
        this.loadTasks();
        this.requestNotificationPermission();
        this.renderCalendar();
        this.renderTasks();
        this.renderStats();
        this.checkReminders();
        setInterval(() => this.checkReminders(), 60000);
      },

      loadTasks() {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        this.tasks = data;
      },

      saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.tasks));
      },

      requestNotificationPermission() {
        if ('Notification' in window && Notification.permission === 'default') {
          document.getElementById('notificationBanner').classList.add('active');
          document.getElementById('notificationBanner').onclick = () => {
            Notification.requestPermission().then(permission => {
              document.getElementById('notificationBanner').classList.remove('active');
            });
          };
        }
      },

      renderCalendar() {
        const year = this.currentDate.getFullYear();
        const month = this.currentDate.getMonth();
        
        document.getElementById('currentMonth').textContent = 
          `${year}/${month + 1}`;

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();

        const today = new Date().toISOString().split('T')[0];
        let html = '';

        // Previous month
        for (let i = firstDay - 1; i >= 0; i--) {
          const day = daysInPrevMonth - i;
          const date = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          html += `<div class="calendar-day other-month">${day}</div>`;
        }

        // Current month
        for (let day = 1; day <= daysInMonth; day++) {
          const date = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const taskCount = this.tasks.filter(t => t.date === date).length;
          const isToday = date === today;
          const isSelected = date === this.selectedDate;
          
          let classes = 'calendar-day';
          if (isToday) classes += ' today';
          if (isSelected) classes += ' selected';
          if (taskCount > 0) classes += ' has-task';

          html += `<div class="${classes}" onclick="app.selectDate('${date}')">${day}</div>`;
        }

        // Next month
        const remaining = 42 - (firstDay + daysInMonth);
        for (let day = 1; day <= remaining; day++) {
          const nextMonth = month + 2;
          const nextYear = month === 11 ? year + 1 : year;
          html += `<div class="calendar-day other-month">${day}</div>`;
        }

        document.getElementById('calendarDays').innerHTML = html;
      },

      selectDate(dateStr) {
        this.selectedDate = dateStr;
        this.renderCalendar();
        this.renderTasks();
      },

      changeMonth(delta) {
        this.currentDate.setMonth(this.currentDate.getMonth() + delta);
        this.renderCalendar();
      },

      renderTasks() {
        const list = document.getElementById('taskList');
        const dateLabel = document.getElementById('selectedDateLabel');
        
        const selectedDate = new Date(this.selectedDate + 'T00:00:00');
        dateLabel.textContent = this.selectedDate === new Date().toISOString().split('T')[0] 
          ? "Today's Tasks" 
          : selectedDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        const dayTasks = this.tasks.filter(t => t.date === this.selectedDate);

        if (dayTasks.length === 0) {
          list.innerHTML = `<div class="empty-state"><span>📝</span><p>No tasks</p></div>`;
          return;
        }

        list.innerHTML = dayTasks.map(task => this.renderTaskItem(task)).join('');
      },

      renderTaskItem(task) {
        const isTimerRunning = activeTimerTaskId === task.id && !isTimerPaused;
        const hasActiveTimer = activeTimerTaskId === task.id;
        const countdown = this.getCountdown(task);
        
        return `
          <li class="task-item" onclick="app.openEditTaskModal('${task.id}')">
            <div class="task-header">
              <div>
                <div class="task-title">${task.title}</div>
                ${task.dueTime ? `<div class="task-time">Due: ${task.dueTime}</div>` : ''}
              </div>
              ${countdown ? `<div class="countdown ${countdown.urgent ? 'urgent' : ''}">${countdown.text}</div>` : ''}
            </div>
            <div class="task-timer-display" onclick="event.stopPropagation()">
              <span class="timer-display ${isTimerRunning ? 'running' : ''}" id="timer-${task.id}">
                ${hasActiveTimer ? this.formatTime(timerSeconds) : (task.workTime ? this.formatTime(task.workTime) : '00:00')}
              </span>
              ${hasActiveTimer 
                ? (isTimerPaused 
                    ? `<button class="timer-btn play" onclick="app.startTimer('${task.id}')">▶</button>
                       <button class="timer-btn stop" onclick="app.stopTimer()">✓</button>`
                    : `<button class="timer-btn pause" onclick="app.pauseTimer()">⏸</button>
                       <button class="timer-btn stop" onclick="app.stopTimer()">✓</button>`)
                : `<button class="timer-btn play" onclick="app.startTimer('${task.id}')">▶</button>`
              }
            </div>
          </li>
        `;
      },

      getCountdown(task) {
        if (!task.dueTime || !task.date) return null;
        
        const now = new Date();
        const due = new Date(task.date + 'T' + task.dueTime);
        const diff = due - now;

        if (diff < 0) return { text: 'Overdue!', urgent: true };
        
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

        if (hours > 24) return { text: `${Math.floor(hours / 24)}d`, urgent: false };
        if (hours > 0) return { text: `${hours}h ${minutes}m`, urgent: hours < 2 };
        return { text: `${minutes}m`, urgent: true };
      },

      formatTime(secs) {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      },

      startTimer(taskId) {
        if (activeTimerTaskId !== taskId) {
          activeTimerTaskId = taskId;
          timerSeconds = this.tasks.find(t => t.id === taskId)?.workTime || 0;
        }
        isTimerPaused = false;
        
        if (timerInterval) clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
          timerSeconds++;
          const el = document.getElementById(`timer-${taskId}`);
          if (el) el.textContent = this.formatTime(timerSeconds);
        }, 1000);

        this.renderTasks();
      },

      pauseTimer() {
        if (activeTimerTaskId) {
          const task = this.tasks.find(t => t.id === activeTimerTaskId);
          if (task) {
            task.workTime = timerSeconds;
            this.saveTasks();
          }
        }
        isTimerPaused = true;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        this.renderTasks();
      },

      stopTimer() {
        if (activeTimerTaskId) {
          const task = this.tasks.find(t => t.id === activeTimerTaskId);
          if (task) {
            task.workTime = timerSeconds;
            this.saveTasks();
          }
        }
        activeTimerTaskId = null;
        timerSeconds = 0;
        isTimerPaused = false;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        this.renderTasks();
      },

      openAddTaskModal() {
        editingTaskId = null;
        document.getElementById('taskModalTitle').textContent = 'Add Task';
        document.getElementById('taskTitle').value = '';
        document.getElementById('taskDate').value = this.selectedDate;
        document.getElementById('taskTime').value = '';
        document.getElementById('taskReminder').value = '0';
        document.getElementById('taskNotes').value = '';
        document.getElementById('deleteTaskBtn').style.display = 'none';
        document.getElementById('taskModal').classList.add('active');
      },

      openEditTaskModal(taskId) {
        const task = this.tasks.find(t => t.id === taskId);
        if (!task) return;

        editingTaskId = taskId;
        document.getElementById('taskModalTitle').textContent = 'Edit Task';
        document.getElementById('taskTitle').value = task.title;
        document.getElementById('taskDate').value = task.date;
        document.getElementById('taskTime').value = task.dueTime || '';
        document.getElementById('taskReminder').value = task.reminder || '0';
        document.getElementById('taskNotes').value = task.notes || '';
        document.getElementById('deleteTaskBtn').style.display = 'block';
        document.getElementById('taskModal').classList.add('active');
      },

      closeModal() {
        document.getElementById('taskModal').classList.remove('active');
      },

      saveTask() {
        const title = document.getElementById('taskTitle').value.trim();
        if (!title) return alert('Please enter a title');

        const task = {
          id: editingTaskId || Date.now().toString(),
          title,
          date: document.getElementById('taskDate').value,
          dueTime: document.getElementById('taskTime').value,
          reminder: document.getElementById('taskReminder').value,
          notes: document.getElementById('taskNotes').value,
          workTime: 0,
          createdAt: editingTaskId ? this.tasks.find(t => t.id === editingTaskId)?.createdAt : Date.now()
        };

        if (editingTaskId) {
          const index = this.tasks.findIndex(t => t.id === editingTaskId);
          if (index > -1) {
            task.workTime = this.tasks[index].workTime;
            this.tasks[index] = task;
          }
        } else {
          this.tasks.push(task);
        }

        this.saveTasks();
        this.closeModal();
        this.renderCalendar();
        this.renderTasks();
      },

      deleteTask() {
        if (!editingTaskId) return;
        if (!confirm('Delete this task?')) return;

        this.tasks = this.tasks.filter(t => t.id !== editingTaskId);
        this.saveTasks();
        this.closeModal();
        this.renderCalendar();
        this.renderTasks();
      },

      switchView(view) {
        document.getElementById('mainView').style.display = view === 'main' ? 'block' : 'none';
        document.getElementById('statsView').style.display = view === 'stats' ? 'block' : 'none';
        document.querySelectorAll('.nav-item').forEach((el, i) => {
          el.classList.toggle('active', (view === 'main' && i === 0) || (view === 'stats' && i === 1));
        });
        if (view === 'stats') this.renderStats();
      },

      renderStats() {
        const content = document.getElementById('statsContent');
        
        // Total work time
        const totalSeconds = this.tasks.reduce((sum, t) => sum + (t.workTime || 0), 0);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);

        // By date
        const byDate = {};
        this.tasks.forEach(t => {
          if (!byDate[t.date]) byDate[t.date] = 0;
          byDate[t.date] += t.workTime || 0;
        });

        const sortedDates = Object.keys(byDate).sort().slice(-7);
        
        let html = `
          <div class="export-import-btns">
            <button class="btn-export" onclick="app.exportTasks()">📤 Export</button>
            <button class="btn-import" onclick="app.importTasks()">📥 Import</button>
          </div>

          <div class="stats-card">
            <h3 style="margin-bottom:15px;">Total Study Time</h3>
            <div style="font-size:32px;font-weight:700;color:var(--primary);">
              ${hours > 0 ? hours + 'h ' : ''}${minutes}m
            </div>
          </div>

          <div class="stats-card">
            <h3 style="margin-bottom:15px;">Last 7 Days</h3>
        `;

        sortedDates.forEach(date => {
          const secs = byDate[date];
          const m = Math.floor(secs / 60);
          const pct = totalSeconds > 0 ? Math.round((secs / totalSeconds) * 100) : 0;
          html += `
            <div class="chart-bar">
              <span class="chart-label">${date.slice(5)}</span>
              <div class="chart-bar-fill">
                <div style="width:${pct}%;height:100%;background:var(--accent);border-radius:10px;"></div>
              </div>
              <span class="chart-bar-value">${m}min</span>
            </div>
          `;
        });

        html += '</div>';
        content.innerHTML = html;
      },

      checkReminders() {
        if (Notification.permission !== 'granted') return;

        const now = new Date();
        
        this.tasks.forEach(task => {
          if (!task.dueTime || !task.date || task.reminder === '0') return;

          const due = new Date(task.date + 'T' + task.dueTime);
          const reminderMinutes = parseInt(task.reminder);
          const reminderTime = new Date(due.getTime() - reminderMinutes * 60000);

          if (now >= reminderTime && now < due) {
            const diffMins = Math.round((due - now) / 60000);
            new Notification('⏰ Task Reminder', {
              body: `${task.title} due in ${diffMins} minutes!`,
              icon: 'icon.svg'
            });
          }
        });
      },

      exportTasks() {
        const data = JSON.stringify(this.tasks, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `pomodo-tasks-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        alert('Tasks exported!');
      },

      importTasks() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              if (Array.isArray(imported)) {
                if (confirm(`Import ${imported.length} tasks? This will add to existing tasks.`)) {
                  imported.forEach(task => {
                    task.id = Date.now().toString() + Math.random().toString(36).substr(2);
                    this.tasks.push(task);
                  });
                  this.saveTasks();
                  this.renderCalendar();
                  this.renderTasks();
                  alert('Tasks imported successfully!');
                }
              } else {
                alert('Invalid file format');
              }
            } catch (err) {
              alert('Error reading file: ' + err.message);
            }
          };
          reader.readAsText(file);
        };
        input.click();
      }
    };

    window.onload = () => app.init();
  </script>
</body>
</html>
